# VERITAS local stack.
#
#   docker compose up -d --build                    API + UI on http://localhost:8000
#   make kafka                                      + Kafka broker + feed poller
#     (= VERITAS_KAFKA_BOOTSTRAP=kafka:9092 docker compose --profile kafka up -d --build)
#
# The API holds the knowledge base in memory, so the API is also the Kafka
# consumer: with VERITAS_KAFKA_BOOTSTRAP set it drains veritas.raw in a
# background thread and every polled document reaches the answers. There is no
# separate ingest-consumer container -- one would build a private knowledge
# base that no question can see.
#
# Postgres and Redis are not in this stack: no code reads them yet.
# docker/initdb/01_schema.sql is the target bitemporal schema (see
# docs/DEPLOYMENT.md), not a running dependency.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: veritas-api:latest
    environment:
      VERITAS_DEVICE: ${VERITAS_DEVICE:-cpu}
      VERITAS_KAFKA_BOOTSTRAP: ${VERITAS_KAFKA_BOOTSTRAP:-}
      VERITAS_API_KEY: ${VERITAS_API_KEY:-}
      VERITAS_ALLOWED_ORIGIN: ${VERITAS_ALLOWED_ORIGIN:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000}
      VERITAS_RATE_LIMIT_PER_MIN: ${VERITAS_RATE_LIMIT_PER_MIN:-60}
    volumes:
      # Mounted over the baked copies, so a retrained model or a fresh data
      # fetch is picked up with a restart instead of a rebuild.
      - ./checkpoints:/app/checkpoints:ro
      - ./data:/app/data
    ports: ["8000:8000"]
    restart: unless-stopped

  # ---------------------------------------------------------------- kafka
  kafka:
    # The official Apache image. bitnami/kafka was withdrawn from Docker Hub's
    # free tier in 2025, so the old tag no longer pulls.
    image: apache/kafka:3.9.1
    profiles: ["kafka"]
    environment:
      # KRaft single node: no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Six partitions: per-entity ordering with room for six consumers.
      KAFKA_NUM_PARTITIONS: 6
      # A week of raw log: enough to rebuild the knowledge base by replay.
      KAFKA_LOG_RETENTION_HOURS: 168
    # 29092 is for clients on the host (scripts/kafka_smoke.py); containers use kafka:9092.
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  worker-poller:
    image: veritas-api:latest
    profiles: ["kafka"]
    command: ["python", "-m", "scripts.run_worker", "--poll", "--interval", "900"]
    environment:
      VERITAS_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
      api: {condition: service_started}
    restart: unless-stopped
