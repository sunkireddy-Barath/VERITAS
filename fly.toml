# Fly.io backend: API + model + UI.
#
#   fly launch --copy-config --no-deploy --name <unique-app-name>
#   fly secrets set VERITAS_ALLOWED_ORIGIN=https://<your-frontend>.vercel.app VERITAS_API_KEY=<random>
#   fly deploy --remote-only
#
# Kafka on Fly: point at a managed cluster with
#   fly secrets set VERITAS_KAFKA_BOOTSTRAP=... VERITAS_KAFKA_SECURITY_PROTOCOL=SASL_SSL \
#     VERITAS_KAFKA_SASL_MECHANISM=SCRAM-SHA-256 VERITAS_KAFKA_USERNAME=... VERITAS_KAFKA_PASSWORD=...
app = "veritas-api"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile.api"

[env]
  VERITAS_DEVICE = "cpu"        # "cuda" on a GPU machine
  VERITAS_LOG_LEVEL = "INFO"
  VERITAS_TRUST_PROXY = "1"     # Fly's edge sets X-Forwarded-For; rate-limit the real client

# No volume: the knowledge base is rebuilt in memory at boot from the data
# baked into the image. A volume mounted at /app/data would also hide that
# seed copy if it were the only source (the API falls back to /app/seed).

[http_service]
  internal_port = 8000
  force_https = true
  # NEVER scale to zero: every cold start reloads the model and re-indexes the
  # corpus, so the first user after an idle period waits ~30 seconds.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[checks.health]
  type = "http"
  port = 8000
  method = "get"
  path = "/health"
  interval = "30s"
  timeout = "10s"
  # Must exceed a CPU boot: embedding ~1,700 chunks on CPU took 382 s under load
  # in testing. Shorter, and the machine is killed before it ever becomes ready.
  grace_period = "600s"
